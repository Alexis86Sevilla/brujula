# Proves a job can run `claude -p` with the subscription token, and that a broken token fails.
trigger: none
pr: none

variables:
  - group: brujula-claude

pool:
  vmImage: ubuntu-24.04

steps:
  - checkout: self
    persistCredentials: false
  - template: templates/setup-claude.yml
  - script: |
      set -euo pipefail
      out="$(claude -p "Reply with exactly: OK" --output-format json --permission-mode dontAsk --max-turns 1)"
      echo "$out" | jq '{result, is_error, cost: .total_cost_usd}'
      echo "$out" | jq -e '(.is_error // false) == false and (.result | test("OK"))' >/dev/null
    displayName: Smoke test
    timeoutInMinutes: 5
    env:
      CLAUDE_CODE_OAUTH_TOKEN: $(CLAUDE_CODE_OAUTH_TOKEN)
