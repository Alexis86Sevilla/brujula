# Triggered ONLY by a branch policy (Build validation). Azure Repos Git ignores `pr:`.
# Build validation runs THIS file from the PR merge commit, so it holds no steps: everything comes
# from a template on main (see pipelines/templates/pr-review-job.yml for the Required template check).
trigger: none
pr: none

resources:
  repositories:
    - repository: trusted
      type: git
      name: MyProject/brujula
      ref: refs/heads/main

extends:
  template: pipelines/templates/pr-review-job.yml@trusted
